name: Daily Dev Gig Curator

on:
  schedule:
    # Runs at 8:00 AM and 8:00 PM UTC every day
    - cron: '0 8,20 * * *' 
  workflow_dispatch: # Allows manual testing

jobs:
  curate-gigs:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the bot to commit code
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install feedparser google-genai

      - name: Run AI Curator Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent.py

      - name: Commit and Push Curation
        run: |
          git config --global user.name "AI Gig Curator"
          git config --global user.email "your-actual-github-email@example.com"
          git add gigs/
          git commit -m "Automated update: AI curated dev gigs" || exit 0
          git push
